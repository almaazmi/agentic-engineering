name: Deploy (reusable)

# Shared deploy logic for every environment. Called by deploy-staging.yml and
# deploy-production.yml. Flow: terraform apply (infra) -> build & push images to
# ACR -> roll container app revisions -> smoke test.
on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or production)."
        required: true
        type: string
      image_tag:
        description: "Image tag to deploy (defaults to the commit SHA)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Skip gracefully until Azure OIDC secrets exist.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Azure secrets not set — skipping deploy. See README > Azure setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.tf.outputs.frontend_url }}
    permissions:
      id-token: write # Azure OIDC
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${ENVIRONMENT}.tfstate"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var-file="environments/${ENVIRONMENT}.tfvars"

      - name: Read Terraform outputs
        id: tf
        working-directory: infra
        run: |
          {
            echo "acr_name=$(terraform output -raw acr_name)"
            echo "acr_login_server=$(terraform output -raw acr_login_server)"
            echo "resource_group=$(terraform output -raw resource_group_name)"
            echo "backend_app=$(terraform output -raw backend_app_name)"
            echo "frontend_app=$(terraform output -raw frontend_app_name)"
            echo "backend_url=$(terraform output -raw backend_url)"
            echo "frontend_url=$(terraform output -raw frontend_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        run: az acr login --name ${{ steps.tf.outputs.acr_name }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tf.outputs.acr_login_server }}/backend:${{ env.IMAGE_TAG }}
            ${{ steps.tf.outputs.acr_login_server }}/backend:${{ env.ENVIRONMENT }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tf.outputs.acr_login_server }}/frontend:${{ env.IMAGE_TAG }}
            ${{ steps.tf.outputs.acr_login_server }}/frontend:${{ env.ENVIRONMENT }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Roll backend revision
        run: |
          az containerapp update \
            --name ${{ steps.tf.outputs.backend_app }} \
            --resource-group ${{ steps.tf.outputs.resource_group }} \
            --image ${{ steps.tf.outputs.acr_login_server }}/backend:${{ env.IMAGE_TAG }}

      - name: Roll frontend revision
        run: |
          az containerapp update \
            --name ${{ steps.tf.outputs.frontend_app }} \
            --resource-group ${{ steps.tf.outputs.resource_group }} \
            --image ${{ steps.tf.outputs.acr_login_server }}/frontend:${{ env.IMAGE_TAG }}

      - name: Smoke test
        run: |
          set -e
          echo "Backend:  ${{ steps.tf.outputs.backend_url }}"
          echo "Frontend: ${{ steps.tf.outputs.frontend_url }}"
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.tf.outputs.backend_url }}/health" >/dev/null; then
              echo "Backend healthy."; break
            fi
            echo "Waiting for backend to become healthy ($i/20)…"; sleep 15
            if [ "$i" -eq 20 ]; then echo "Backend never became healthy"; exit 1; fi
          done
          curl -fsS -o /dev/null "${{ steps.tf.outputs.frontend_url }}" && echo "Frontend reachable."

      - name: Summary
        run: |
          {
            echo "### ${ENVIRONMENT} deployed :rocket:"
            echo ""
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Frontend | ${{ steps.tf.outputs.frontend_url }} |"
            echo "| Backend | ${{ steps.tf.outputs.backend_url }} |"
            echo ""
            echo "Image tag: \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
