name: Feature request
description: Propose a change or new capability.
labels: [enhancement, triage]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist an agent can verify when the work is done.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover the new behaviour
        - [ ] Docs updated
    validations:
      required: true
