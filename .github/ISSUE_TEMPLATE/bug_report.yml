name: Bug report
description: Report something that is broken.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more precise this is, the more likely an
        agent (Copilot or Claude) can fix it autonomously.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the bug.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, infra, ci/cd, unknown]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Call '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Logs / screenshots / environment
    validations:
      required: false
